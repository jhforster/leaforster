<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4FB"/>
      <stop offset="100%" stop-color="#E3D8F0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Stem with a soft curve -->
  <path d="M32 56 C30.5 48, 33.5 40, 32 30"
        stroke="#5E4A82" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Leaves -->
  <path d="M32 44 C26 42, 22 44, 22 48 C26 48, 30 47, 32 44 Z" fill="#7E68A6" opacity="0.55"/>
  <path d="M32 38 C38 36, 42 38, 42 42 C38 42, 34 41, 32 38 Z" fill="#7E68A6" opacity="0.55"/>

  <!-- Lavender bud cluster -->
  <g fill="#9D86C4">
    <ellipse cx="32" cy="11" rx="4" ry="5"/>
    <ellipse cx="27" cy="16" rx="4" ry="5"/>
    <ellipse cx="37" cy="16" rx="4" ry="5"/>
    <ellipse cx="29" cy="22" rx="4" ry="5"/>
    <ellipse cx="35" cy="22" rx="4" ry="5"/>
    <ellipse cx="32" cy="27" rx="4" ry="5"/>
  </g>
  <!-- Highlights on a couple buds for depth -->
  <g fill="#CDBBE2" opacity="0.7">
    <ellipse cx="31" cy="10" rx="1.2" ry="1.6"/>
    <ellipse cx="26" cy="15" rx="1.2" ry="1.6"/>
    <ellipse cx="34" cy="21" rx="1.2" ry="1.6"/>
  </g>
</svg>
